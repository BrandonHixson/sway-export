name: Export Sway

on:
  schedule:
    - cron: "0 19 * * 1,2" # Mondays and Tuesdays at 3:00 PM ET (19:00 UTC)
  workflow_dispatch: # run manually from the Actions tab

concurrency:
  group: sway-export
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5            # a hung run can't burn 10 minutes
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Export Sway to PDF
        env:
          PW_CHANNEL: chrome
          SWAY_URL: ${{ vars.SWAY_URL }}
        run: |
          if [ -n "$SWAY_URL" ]; then
            npx tsx sway_export_pdf.ts "$SWAY_URL" -o week.pdf
          else
            npx tsx sway_export_pdf.ts -o week.pdf
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: sway-pdf
          path: week.pdf
          retention-days: 7